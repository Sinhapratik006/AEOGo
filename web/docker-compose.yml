# Local PostgreSQL for development: `docker compose up -d`
# Matches DATABASE_URL=postgres://postgres:postgres@localhost:5432/aeogo in .env.example
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aeogo
    ports:
      - "5432:5432"
    volumes:
      - aeogo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aeogo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeogo-postgres:
